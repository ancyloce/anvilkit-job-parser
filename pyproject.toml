[project]
name = "anvilkit-parser"
version = "0.1.0"
description = "Parser Job of the AnvilKit Agent platform (DD-07 §2, delivery.md P15): the fixed Docling parser and its trusted stager."
requires-python = ">=3.12,<3.13"
# Exact, hash-pinned versions live in requirements.lock (uv pip compile
# --generate-hashes); the image installs that lock with --require-hashes.
dependencies = ["docling==2.132.0", "jsonschema==4.25.1"]

[project.scripts]
anvilkit-parse = "anvilkit_parser.parse:main"
anvilkit-stage = "anvilkit_parser.stage:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
