# Independent verification of the anvilkit-parser Job image from this
# repository alone: the image (the contract schema jobs/job.schema.json from a
# checkout of the contracts repository at the commit the parent pins: 1c3ef95,
# tag go/v0.1.10; the hash-locked dependencies and the layout weights of
# models.lock fetched and verified at build) and the tests inside that image
# with no network on a read-only root (real Docling conversions with the
# pinned weights, every guard, the stager against a local HTTP server).
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ancyloce/anvilkit-agent-contracts
          ref: 1c3ef955b34f7a28e0ba1aabd7a275d030bf2236
          path: contracts
      - run: docker build --build-context contracts=contracts -t anvilkit-parser:ci .
      - run: docker run --rm --network none --read-only --tmpfs /tmp --entrypoint /opt/venv/bin/python -w /opt/anvilkit anvilkit-parser:ci -m unittest discover -s tests
